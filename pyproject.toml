[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mpltweak"
version = "0.1.8"
description = "Interactive layout editor for matplotlib multi-panel figures - drag, align, snap, then write the numbers back into your Python code"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "shdbl" }]
keywords = [
    "matplotlib",
    "figure",
    "layout",
    "plot",
    "visualization",
    "interactive",
    "gui",
    "ai-agent",
    "llm",
    "mcp",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.5",
]

[project.optional-dependencies]
# 开窗调图需要一个图形后端。**故意不设成默认依赖**：
#   - 服务器 / headless 环境只用 describe / check / apply / mcp，没必要装 100MB 的 Qt；
#   - 有些用户环境已有 PySide6 / PyQt6，不该被硬塞一个 PyQt5；
#   - macOS / Linux 上 Qt 依赖偶有麻烦。
# 没装时 `mpltweak <脚本>` 会给出明确的安装指引（见 launch.py 的无后端分支）。
qt = ["PyQt5>=5.15"]
# 只在用 `mpltweak mcp`（把排版能力暴露给 AI 客户端）时需要。
# 必须带 python_version 标记：mcp 包要求 Python >= 3.10，否则 3.9 上
# `pip install "mpltweak[mcp]"` 会**静默降级到旧版本且不装 mcp**（t4-F7）。
mcp = ["mcp>=1.0; python_version >= '3.10'"]
all = ["PyQt5>=5.15", "mcp>=1.0; python_version >= '3.10'"]
# 贡献者用的：pytest 只为"把七个纯脚本套件包出报告"服务，运行时不需要它。
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/shdbl/mpltweak"
Repository = "https://github.com/shdbl/mpltweak"
Issues = "https://github.com/shdbl/mpltweak/issues"

[project.scripts]
mpltweak = "mpltweak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mpltweak = ["resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 只收集这两个"包装"文件。七个套件本身是**模块级脚本**（没有 if __name__ 守卫），
# 默认规则会把它们当测试模块 import —— 那会在收集期就把整个套件跑掉，失败还表现为
# ImportError，看不出是哪条断言挂了。包装文件用子进程跑它们并给出清晰的报告。
python_files = ["test_suites.py", "test_hygiene.py"]
