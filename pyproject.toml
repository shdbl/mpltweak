[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mpltweak"
version = "0.1.5"
description = "像在 PPT 里调多图排版一样调 matplotlib：拖拽排版 + AST 确定性写回脚本（调试零侵入）"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "shdbl" }]
keywords = [
    "matplotlib",
    "figure",
    "layout",
    "plot",
    "visualization",
    "interactive",
    "gui",
    "ai-agent",
    "llm",
    "mcp",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.5",
    "PyQt5>=5.15",
]

[project.optional-dependencies]
# 只在用 `mpltweak mcp`（把排版能力暴露给 AI 客户端）时需要
mcp = ["mcp>=1.0"]

[project.urls]
Homepage = "https://github.com/shdbl/mpltweak"
Repository = "https://github.com/shdbl/mpltweak"
Issues = "https://github.com/shdbl/mpltweak/issues"

[project.scripts]
mpltweak = "mpltweak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mpltweak = ["resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
