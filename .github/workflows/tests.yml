name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows 上的 run 步骤统一用 Git Bash，保持与 Linux 相同的 bash 语法
    # （set -e 循环 / heredoc / `|| true` 都能跑）。
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
        os: [ubuntu-latest, windows-latest]
    env:
      # 测试全程无头，只用 Agg。开窗那部分（Qt）不参与 CI ——
      # 源码里 Qt 的 import 都在函数内部，模块顶层不碰 Qt。
      MPLBACKEND: Agg
      # Windows runner 的 Python 默认 stdout 是 cp1252，编不了中文测试名
      # （test_tweak 的「近边吸附」等在 cp1252 下直接 UnicodeEncodeError）。
      # 显式 UTF-8，与本地验证环境（longxia + PYTHONIOENCODING=utf-8）一致。
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 刻意 --no-deps：CI 不需要 PyQt5（那是开窗才用的），
          # 只装测试真正依赖的 matplotlib / numpy / mcp。
          python -m pip install matplotlib numpy
          # mcp 要求 Python >= 3.10；3.9 上跳过它，test_mcp 会自行 skip。
          if [ "${{ matrix.python-version }}" != "3.9" ]; then
            python -m pip install "mcp>=1.0"
          fi
          python -m pip install -e . --no-deps

      - name: Run test suites
        run: |
          set -e
          for t in test_tweak test_events test_redo test_writeback \
                   test_agent_api test_check test_mcp; do
            echo "::group::$t"
            python "tests/$t.py"
            echo "::endgroup::"
          done

      # 方案 B（用户 2026-10-14 拍板）：3.12 保留全量 pytest，**只给 3.9** 补一个秒级
      # "新套件冒烟"。为什么只在 3.9：0.1.9 之后新增的 10 个套件此前在 3.9/3.10/3.11 上
      # 从不执行（下面的 pytest step 被 `if: 3.12` 限死），而**旧 Python 上最容易炸的正是
      # "语法 / 导入 / 编码"这类秒级就能发现的问题** —— 把它们挡在最便宜的 3.9 这条 leg 上，
      # 其余 leg 不乘 4，CI 时间不涨。
      # 覆盖（按 tests/test_suites.py 的 SUITES 逐条核过）：test_docs（纯文本锚点/链接）、
      # test_notation_discipline（AST 记号纪律）、test_tmpdir_discipline（临时目录取法），
      # 外加 test_hygiene 的"套件在 GBK 控制台不崩"那 3 条（-k 顺带命中，同样是秒级）。
      # 刻意**不含** test_real_window（真开窗会抢焦点）与 test_corpus_invariants（仓库外语料
      # + 分钟级真跑）—— 两者本就不在 SUITES 里，此处也不引入。
      # 实测（本机 longxia + en）：6 passed / 68 deselected / 3.9s。
      #
      # 0.1.15（§27.10 L12）：**写回/CLI 类套件也上 3.9**。原来这里只有"文档类"三条，
      # 而"最低支持版本能不能真写回"没有任何一条腿证明过。补的这 5 条都是纯子进程 /
      # 零窗口 / 零新依赖，本机 py39_audit（Python 3.9.25 + matplotlib 3.9.4）逐条实测绿：
      #   msg_key_audit 3.0s / cli_fuzz 4.3s / verify_onepass 10.3s / sandbox 12.0s /
      #   apply_layout_conflict 29.0s  ⇒ 合计约 59s（实测 -k 全跑 65s / 10 passed）。
      #   verify_onepass + apply_layout_conflict 就是"写回类要在 3.9 上有证据"的落点。
# 0.1.17：demo（示例体验）也上 3.9 —— 它只起子进程 + 复制文件 + 一次真写回，
#   离屏（--no-window），本机约 25s；新用户的第一条命令不该只在最新版上验过。
      # 同批**刻意仍不加**：figure_matrix（CI 上 N=100 要 260~350s）、journey_wheel
      # （本机 3.9 上唯一没绿的，是"非 editable 安装"的环境问题，不拿它当 3.9 门槛）、
      # gui_smoke（要 ~100MB PyQt5，L2 已定只给 3.12）、test_suites（包装器，自己会跑全表）。
      - name: Fast smoke of the new suites (3.9 only)
        if: matrix.python-version == '3.9'
        run: |
          # 3.9 leg 的安装步骤只装 matplotlib/numpy（不装 pytest）——这里补上。
          # 刻意不装 hypothesis：三个 property 套件有 tests/_hypothesis_shim.py 兜底，
          # 本 step 选的这些也不依赖它。
          python -m pip install "pytest>=7.0"
          # 单行写完：别用 `\` 续行（YAML 块标量里那根反斜杠会原样留在字符串里，
          # tools/ci_suite_coverage.py 分词时会把它当成一个关键字）。
          python -m pytest -q -k "docs or notation_discipline or tmpdir_discipline or msg_key_audit or cli_fuzz or verify_onepass or sandbox or apply_layout_conflict or demo"

      # 同一批套件再走一遍 pytest：拿到逐条用例的报告（GitHub 的失败摘要/重跑单条），
      # 外加工程卫生棘轮（宽兜底计数 / 消息 GBK 可编码）。只在最新版 python 上跑，
      # 避免把 CI 时间乘 4。见 tests/test_suites.py 与 tests/test_hygiene.py。
      - name: pytest report + hygiene ratchet
        if: matrix.python-version == '3.12'
        run: |
          # hypothesis 是 3 个 property 套件的依赖（test_fuzz_events / test_fuzz_params /
          # test_property_writeback）。**必须装**：否则它们只会打印 SKIP，property 在 CI
          # 里永远不跑（缺依赖时套件仍能 import 并跑完确定性断言，见 tests/_hypothesis_shim.py）。
          python -m pip install "pytest>=7.0" "hypothesis>=6.0"
          # ---- F3（0.1.14，§27.10 L2）：**只在这一腿装 PyQt5** ----
          # 为什么只 3.12（体积 + 时长 + 判据与解释器版本无关）：
          #   * 体积：PyQt5 + PyQt5-Qt5 轮子约 100 MB，8 条腿各装一次纯属浪费；
          #   * 时长：装 + 离屏冒烟约 20~30 秒；这条腿本来就要跑全量 pytest，捎带一脚，
          #     CI 总时长几乎不涨（其余腿零 GUI 依赖、名单一个字没动）；
          #   * 判据与解释器版本无关：GUI 冒烟查的是"Qt 事件 → toolbox → 关窗导出"这条链，
          #     与 3.9/3.10/3.11 的语法差异无关 —— 那是 3.9 腿"新套件秒级冒烟"的活。
          # 回滚办法：删掉下面这一行 `pip install "PyQt5>=5.15"` 即可 —— 冒烟会在没有 Qt 的
          # 环境里**显式 skip 并打印原因**（见 tests/test_gui_smoke.py 文件头），
          # 既不会假绿（下面那条 import 断言会红）也不会把别的腿拖红。
          python -m pip install "PyQt5>=5.15"
          # **先断言它真装上了**：否则 GUI 冒烟会走 skip 分支，"CI 里悄悄没跑"就成了假绿。
          # 这条与套件本身的 skip 是配套的两件事：装不上 ⇒ 这里红；装上但平台插件起不来 ⇒
          # 套件 skip 并打印原因（见该文件里的 qt_init_error 分支）。
          python -c "import PyQt5.QtCore as c; print('PyQt5', c.PYQT_VERSION_STR)"
          # 无头 runner 没有显示器：窗口只在 QPA 的 offscreen 插件里存在（不碰屏幕）。
          export QT_QPA_PLATFORM=offscreen
          # 用 Python 包装：把失败摘要写进 job summary（API 拿不到 job 日志时这是唯一可读通道），
          # 并原样回传 pytest 的退出码。shell 无关（windows 是 pwsh、ubuntu 是 bash）。
          python tools/ci_pytest_summary.py
          # test_cli_output：pytest 函数式套件，但 pyproject 的 `python_files` 只收
          # test_suites.py / test_hygiene.py ⇒ 上面那次裸 `pytest -q` **收不到它**
          # （t3 的覆盖检查照出来的真缺口：它从未在 CI 跑过）。这里显式给路径，
          # 并入**同一个 step**（不新开 step、不装新解释器），实测 14 passed / 13.1s。
          # 放在最后一行：两个 shell（bash / pwsh）都以"最后一条命令的退出码"判 step
          # 成败 ⇒ 它红了这条腿就红，不会被前面的 summary 掩盖。
          python -m pytest -q tests/test_cli_output.py

      # 0.1.9 新增：**CI 过去从不构建发行物** —— 打包缺件 / sdist 混进构建元数据
      # 这类问题只有到发版那一刻才会暴露（CH-11 的 `src/mpltweak.egg-info` 就是这么
      # 漏出去的，而修好 MANIFEST.in 之后也没有任何地方能证明它真的生效）。
      # 这里只做最便宜的一件事：能构建 + wheel 里有包 + sdist 不带 egg-info + 打印体积。
      # 只在 3.12 上跑（建包与解释器版本无关，不必乘 4）。
      - name: Build wheel + sdist (assert the sdist carries no build metadata)
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build
          # 默认**隔离**构建：顺带验证 pyproject 的 build-system.requires 真能解析
          python -m build --outdir dist
          python - <<'PY'
          import glob
          import os
          import sys
          import tarfile
          import zipfile

          for p in sorted(glob.glob('dist/*')):
              print('%-46s %9.1f KiB'
                    % (os.path.basename(p), os.path.getsize(p) / 1024.0))

          whl = sorted(glob.glob('dist/*.whl'))
          sdist = sorted(glob.glob('dist/*.tar.gz'))
          assert whl, 'no wheel built'
          assert sdist, 'no sdist built'
          names = zipfile.ZipFile(whl[0]).namelist()
          for want in ('mpltweak/__init__.py', 'mpltweak/toolbox.py'):
              assert want in names, 'wheel is missing %s' % want
          print('wheel OK: %d entries' % len(names))

          tn = tarfile.open(sdist[0]).getnames()
          # 精确到"陈旧元数据文件"而不是"任何含 egg-info 的条目"：setuptools 的
          # sdist **强制**带上 `src/mpltweak.egg-info/SOURCES.txt`（它就是 manifest
          # 本身，MANIFEST.in 的 prune/exclude 都删不掉，实测过）。CH-11 真正要挡的
          # 是下面这 5 个会被误当"项目内容"的文件。
          STALE = ('PKG-INFO', 'requires.txt', 'top_level.txt',
                   'dependency_links.txt', 'entry_points.txt')
          bad = [n for n in tn if 'egg-info' in n and os.path.basename(n) in STALE]
          if bad:
              print('ERROR: the sdist carries stale build metadata (CH-11 regression):')
              for n in bad:
                  print('  ' + n)
              sys.exit(1)
          print('sdist OK: %d entries, no stale egg-info metadata' % len(tn))
          PY

      - name: Smoke-test the CLI
        run: |
          mpltweak --help
          # doctor 会探测交互后端；无头 runner 上没有 Qt/Tk，它给出人话提示后
          # 返回非 0 是预期行为，不算失败。
          mpltweak doctor || true
